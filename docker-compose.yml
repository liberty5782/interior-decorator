services:
  roomplanner:
    build: ./server
    container_name: roomplanner
    restart: unless-stopped
    # Match the owner of ./data on the host (same idea as PUID/PGID in arr-stack containers).
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${ROOMPLANNER_PORT:-8000}:8000"
    environment:
      ROOMPLANNER_MAX_UPLOAD_MB: "100"
    volumes:
      # SQLite DB + all media (images, depth maps, GLBs). Back this up.
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
